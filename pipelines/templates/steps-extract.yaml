# Extract → lint → summarise → keep as pipeline artifact → open pull request.

parameters:
  - name: region
    type: string
  - name: environment
    type: string
  - name: serviceConnection
    type: string

steps:
  # Deployment jobs don't check out the repository automatically.
  - checkout: self
    fetchDepth: 1

  - template: steps-install-apiops.yaml

  # The AzureCLI task signs in with the target's service connection; the CLI uses that session.
  - task: AzureCLI@2
    displayName: Extract from $(APIM_NAME)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: $(Build.SourcesDirectory)/scripts/Invoke-ApiOpsTool.ps1
      arguments: >-
        -Command extract
        -CliPath '$(APIOPS_CLI_PATH)'
        -ServiceName '$(APIM_NAME)'
        -ResourceGroupName '$(APIM_RESOURCE_GROUP)'
        -SubscriptionId '$(AZURE_SUBSCRIPTION_ID)'
        -ArtifactsPath '$(Build.ArtifactStagingDirectory)/$(ARTIFACTS_FOLDER)'
        -FilterPath '$(Build.SourcesDirectory)/configurations/${{ parameters.region }}/${{ parameters.environment }}/configuration.extractor.yaml'

  - task: PowerShell@2
    displayName: Lint API definitions (Spectral, $(LINT_MODE))
    inputs:
      pwsh: true
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/scripts/Invoke-ApiLint.ps1
      arguments: >-
        -ArtifactsPath '$(Build.ArtifactStagingDirectory)/$(ARTIFACTS_FOLDER)'
        -RulesetPath '$(Build.SourcesDirectory)/.spectral.yaml'
        -ResultsPath '$(Build.ArtifactStagingDirectory)/lint/spectral-junit.xml'
        -SpectralVersion '$(SPECTRAL_CLI_VERSION)'
        -Mode '$(LINT_MODE)'
        -InstallPath '$(Agent.TempDirectory)/spectral'

  - task: PublishTestResults@2
    displayName: Publish lint results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: spectral-junit.xml
      searchFolder: $(Build.ArtifactStagingDirectory)/lint
      testRunTitle: API lint - ${{ parameters.region }} / ${{ parameters.environment }}
      failTaskOnFailedTests: false
      failTaskOnMissingResultsFile: false

  - task: PowerShell@2
    displayName: Write run summary
    inputs:
      pwsh: true
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/scripts/Write-RunSummary.ps1
      arguments: >-
        -Operation Extract
        -Region '${{ parameters.region }}'
        -Environment '${{ parameters.environment }}'
        -ServiceName '$(APIM_NAME)'
        -ArtifactsPath '$(Build.ArtifactStagingDirectory)/$(ARTIFACTS_FOLDER)'
        -OutputPath '$(Agent.TempDirectory)/apiops-summary.md'

  - task: PublishPipelineArtifact@1
    displayName: Keep extracted files with the run
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: apiops-extract-${{ parameters.region }}-${{ parameters.environment }}-$(System.JobAttempt)

  - task: PowerShell@2
    displayName: Open pull request into $(RELEASE_BRANCH)
    inputs:
      pwsh: true
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/scripts/New-ArtifactsPullRequest.ps1
      arguments: >-
        -ExtractedPath '$(Build.ArtifactStagingDirectory)/$(ARTIFACTS_FOLDER)'
        -ArtifactsFolder '$(ARTIFACTS_FOLDER)'
        -TargetBranch '$(RELEASE_BRANCH)'
        -Region '${{ parameters.region }}'
        -Environment '${{ parameters.environment }}'
        -LintResultsPath '$(Build.ArtifactStagingDirectory)/lint/spectral-junit.xml'
        -WorkingDirectory '$(Agent.TempDirectory)/apiops-pr'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
